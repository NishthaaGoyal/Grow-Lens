services:
  - type: web
    name: grow-lens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard (Supabase connection string)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: REDIS_URL
        value: ""             # Leave blank — app falls back to in-memory cache
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel URL e.g. https://grow-lens.vercel.app
